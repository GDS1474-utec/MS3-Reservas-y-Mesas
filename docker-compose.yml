services:
  mongo-db:
    image: mongo:7
    container_name: ms3-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ms3_reservas_db
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ms3-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "mongodb://localhost:27017/admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms3-api:
    build: .
    container_name: ms3-api
    restart: unless-stopped
    depends_on:
      mongo-db:
        condition: service_healthy
    environment:
      PORT: 8003
      MONGO_URI: mongodb://mongo-db:27017/ms3_reservas_db
      # MS1 está expuesto en el host por el puerto 8000.
      # Cuando integren ambos servicios en una misma red Docker,
      # pueden cambiarlo por http://ms1-api:8000.
      MS1_URL: ${MS1_URL:-http://host.docker.internal:8000}
      MS1_TIMEOUT_MS: ${MS1_TIMEOUT_MS:-3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:8003"
    networks:
      - ms3-network

volumes:
  mongo_data:

networks:
  ms3-network:
    driver: bridge
